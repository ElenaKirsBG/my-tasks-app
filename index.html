<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ежедневник</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ежедневник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* ===== Темы ===== */
body.theme-light{--bg:#f4f6fa;--card:#fff;--subtle:#eef1f6;--text:#0f172a;--muted:#64748b;--border:#e3e8ef;--accent:#4f46e5;--on-accent:#fff;--soft:rgba(79,70,229,.10)}
body.theme-dark{--bg:#0b1120;--card:#162033;--subtle:#22304a;--text:#f1f5f9;--muted:#94a3b8;--border:#26344d;--accent:#818cf8;--on-accent:#0b1120;--soft:rgba(129,140,248,.16)}
body.theme-pastel{--bg:#fbf4ee;--card:#fffdfb;--subtle:#f3e8de;--text:#4a3e3d;--muted:#8c7a78;--border:#ecdccf;--accent:#b0697a;--on-accent:#fff;--soft:rgba(176,105,122,.12)}
body.theme-cyberpunk{--bg:#0d0221;--card:#190938;--subtle:#2b0c5a;--text:#00f0ff;--muted:#ff5fa8;--border:#4a1475;--accent:#ff007f;--on-accent:#fff;--soft:rgba(255,0,127,.16)}
body.theme-minimal{--bg:#fff;--card:#fff;--subtle:#f4f4f4;--text:#171717;--muted:#737373;--border:#e5e5e5;--accent:#171717;--on-accent:#fff;--soft:rgba(0,0,0,.06)}
:root{--danger:#e11d48;--ok:#10b981;--warn:#f59e0b;--row-py:.42rem;--radius:14px}
body.density-normal{--row-py:.7rem}

*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;line-height:1.3;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);font-size:16px}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* ===== Каркас ===== */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + .5rem) .9rem .4rem;display:flex;align-items:center;gap:.5rem}
.top h1{font-size:1.15rem;margin:0;font-weight:750;letter-spacing:-.01em}
.top .sub{font-size:.75rem;color:var(--muted);margin-top:1px}
.top .grow{flex:1;min-width:0}
.ibtn{width:2.25rem;height:2.25rem;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--muted)}
.ibtn:active,.ibtn.on{background:var(--subtle);color:var(--text)}
.wrap{max-width:780px;margin:0 auto;padding:0 .75rem calc(8.5rem + env(safe-area-inset-bottom))}
.side,.main{min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}

.search{margin:0 0 .5rem;display:flex;align-items:center;gap:.4rem;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 .6rem}
.search input{flex:1;border:0;background:none;outline:none;padding:.55rem 0}

/* ===== Календарь ===== */
.cal{padding:.45rem .45rem .35rem;margin-bottom:.5rem;touch-action:pan-y}
.calhead{display:flex;align-items:center;gap:.15rem;margin-bottom:.2rem}
.caltitle{flex:1;text-align:left;font-weight:700;font-size:.95rem;padding:.3rem .4rem;border-radius:9px;display:flex;align-items:center;gap:.3rem;text-transform:capitalize}
.caltitle svg{font-size:.8rem;color:var(--muted);transition:transform .2s}
.cal.month .caltitle svg{transform:rotate(180deg)}
.pill{font-size:.78rem;font-weight:600;padding:.3rem .6rem;border-radius:999px;background:var(--subtle);white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem}
.pill.acc{background:var(--soft);color:var(--accent)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{font-size:.66rem;text-align:center;color:var(--muted);text-transform:uppercase;padding:.15rem 0;font-weight:600}
.wd.we{color:var(--danger);opacity:.75}
.day{height:2.6rem;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.day .n{font-size:.9rem;font-weight:600;line-height:1}
.day.oth .n{color:var(--muted);opacity:.55}
.day.we .n{color:var(--danger)}
.day.today .n{color:var(--accent);font-weight:800}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent)}
.day.sel .n{color:var(--on-accent)!important}
.day.late:not(.sel) .n{text-decoration:underline;text-decoration-color:var(--danger);text-decoration-thickness:2px;text-underline-offset:2px}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.day.sel .dots i{box-shadow:0 0 0 1px var(--on-accent)}

/* ===== Вкладки и разделы ===== */
.tabs{display:flex;background:var(--subtle);border-radius:12px;padding:3px;gap:2px;margin-bottom:.45rem}
.tab{flex:1 1 auto;min-width:0;font-size:.76rem;font-weight:600;padding:.42rem .2rem;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:.3rem;white-space:nowrap}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab b{font-size:.68rem;font-weight:700;background:var(--soft);color:var(--accent);padding:0 .35rem;border-radius:6px;line-height:1.35}
.chips{display:flex;gap:.35rem;overflow-x:auto;padding:.05rem 0 .5rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:.8rem;font-weight:600;padding:.32rem .65rem;border-radius:999px;background:var(--card);border:1px solid var(--border);display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.chip .c{width:8px;height:8px;border-radius:50%}
.chip small{font-size:.7rem;color:var(--muted);font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on small{color:var(--on-accent);opacity:.8}
.chip.add{color:var(--muted)}

/* ===== Список ===== */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;padding:.1rem .2rem .4rem}
.dayhead h2{margin:0;font-size:1rem;font-weight:750}
.dayhead span{font-size:.75rem;color:var(--muted)}
.group{margin-bottom:.5rem;overflow:hidden}
.gh{display:flex;align-items:center;gap:.4rem;padding:.42rem .65rem;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer;user-select:none}
.gh .chev{transition:transform .2s;font-size:.8rem}
.gh.closed .chev{transform:rotate(-90deg)}
.gh .gt{flex:1;display:flex;align-items:center;gap:.4rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .c{width:8px;height:8px;border-radius:50%;flex:none}
.gh .cnt{font-weight:700;background:var(--subtle);padding:0 .4rem;border-radius:6px;font-size:.7rem}
.gh .gact{text-transform:none;letter-spacing:0;font-size:.74rem;color:var(--accent);font-weight:650;padding:.1rem .3rem}
.gh.red{color:var(--danger)}
.rows{border-top:1px solid var(--border)}
.row{display:flex;align-items:center;gap:.55rem;padding:var(--row-py) .65rem;border-bottom:1px solid var(--border);position:relative;min-height:2.35rem}
.row:last-child{border-bottom:0}
.row.p1::before,.row.p2::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;background:var(--warn)}
.row.p2::before{background:var(--danger)}
.chk{width:1.3rem;height:1.3rem;border-radius:7px;border:1.8px solid var(--muted);opacity:.85;display:flex;align-items:center;justify-content:center;flex:none;font-size:.8rem;color:var(--on-accent)}
.row.p2 .chk{border-color:var(--danger)}
.is-checked .chk{background:var(--accent);border-color:var(--accent);opacity:1}
.chk.done{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.tx{flex:1;min-width:0;display:flex;align-items:center;gap:.45rem;cursor:pointer}
.tx .t{flex:1;min-width:0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.wrap-text .tx .t{white-space:normal;overflow-wrap:anywhere}
.row.p2 .t{font-weight:650}
.is-checked .t,.row.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;align-items:center;gap:.35rem;flex:none;color:var(--muted);font-size:.72rem}
.meta svg{font-size:.78rem}
.tm{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.db{background:var(--subtle);padding:.05rem .35rem;border-radius:6px;font-weight:600;white-space:nowrap}
.db.od{background:rgba(225,29,72,.12);color:var(--danger)}
.cdot{width:7px;height:7px;border-radius:50%}
.ract{color:var(--muted);font-size:.95rem;padding:.25rem;border-radius:8px}
.ract:active{background:var(--subtle)}
.empty{text-align:center;color:var(--muted);font-size:.85rem;padding:1.6rem 1rem}
.empty svg{font-size:1.6rem;display:block;margin:0 auto .5rem;opacity:.6}
.more{display:block;width:100%;text-align:center;font-size:.8rem;color:var(--accent);font-weight:600;padding:.5rem}

/* ===== Нижняя панель ввода ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 .6rem calc(.5rem + env(safe-area-inset-bottom));pointer-events:none}
.dock>*{pointer-events:auto;max-width:780px;margin:0 auto}
.transfer{display:flex;align-items:center;gap:.5rem;background:var(--text);color:var(--bg);border-radius:12px;padding:.45rem .5rem .45rem .8rem;margin-bottom:.4rem;font-size:.82rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.transfer span{flex:1}
.transfer button{background:var(--accent);color:var(--on-accent);padding:.38rem .7rem;border-radius:9px;font-size:.8rem;font-weight:700}
.transfer .x{background:none;color:var(--bg);opacity:.7;padding:.3rem}
.addbar{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 28px rgba(15,23,42,.14);padding:.4rem}
.addopts{display:flex;gap:.3rem;align-items:center;padding:0 .1rem .35rem;overflow-x:auto;scrollbar-width:none}
.addopts::-webkit-scrollbar{display:none}
.addopts .pill .c{width:8px;height:8px;border-radius:50%}
.addrow{display:flex;align-items:flex-end;gap:.4rem}
.addrow textarea{flex:1;resize:none;border:0;outline:none;background:var(--subtle);border-radius:12px;padding:.55rem .7rem;max-height:9.5rem;line-height:1.3}
.send{width:2.45rem;height:2.45rem;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex:none}
.send:disabled{opacity:.35}

/* ===== Шторка (sheet) ===== */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45);animation:fade .18s}
.sheet{position:relative;background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:.5rem 1rem calc(1rem + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:2.4rem;height:5px;border-radius:3px;background:var(--border);margin:0 auto .6rem}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:.1rem 0 .8rem;font-size:1.05rem;display:flex;align-items:center;gap:.4rem}
.fld{margin-bottom:.8rem}
.fld>label,.lbl{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.03em}
.inp{width:100%;border:1px solid var(--border);background:var(--subtle);border-radius:11px;padding:.55rem .7rem;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:2.6rem}
.hrow{display:flex;gap:.4rem;flex-wrap:wrap}
.hrow>.inp{flex:1;min-width:0}
.seg{display:flex;background:var(--subtle);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:.45rem .3rem;border-radius:8px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.qd{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.45rem}
.qd .pill.on{background:var(--accent);color:var(--on-accent)}
.btns{display:flex;gap:.5rem;margin-top:1rem}
.btn{flex:1;padding:.7rem;border-radius:12px;font-weight:700;font-size:.9rem;background:var(--subtle);display:flex;align-items:center;justify-content:center;gap:.4rem}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.dng{color:var(--danger);flex:0 0 auto;padding:.7rem .9rem}
.list-opt{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:.6rem;padding:.65rem .6rem;border-radius:11px;text-align:left;font-weight:600}
.opt:active,.opt.on{background:var(--subtle)}
.opt .c{width:10px;height:10px;border-radius:50%}
.opt .r{margin-left:auto;color:var(--accent)}
.catrow{display:flex;align-items:center;gap:.35rem;margin-bottom:.4rem}
.catrow .sw{width:1.9rem;height:1.9rem;border-radius:9px;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--border)}
.catrow .em{width:2.6rem;text-align:center;padding:.5rem .2rem}
.catrow .nm{flex:1;min-width:0}
.catrow .ibtn{width:1.9rem;height:2rem}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.themes button{padding:.6rem;border-radius:11px;border:1.5px solid var(--border);font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.45rem}
.themes button.on{border-color:var(--accent);color:var(--accent)}
.themes i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem 0;font-size:.9rem}
.tgl small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
.sw-t{appearance:none;-webkit-appearance:none;width:2.7rem;height:1.6rem;border-radius:1rem;background:var(--border);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw-t:checked{background:var(--accent)}
.sw-t:checked::after{left:calc(100% - 1.2rem - 3px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{font-size:.8rem;color:var(--muted);background:var(--subtle);border-radius:11px;padding:.6rem .7rem;line-height:1.4}
hr.sep{border:0;border-top:1px solid var(--border);margin:1rem 0}

/* ===== Уведомление ===== */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + .6rem);transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:.55rem .6rem .55rem .9rem;border-radius:12px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.7rem;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;width:max-content;white-space:nowrap;animation:fade .2s}
.toast button{color:var(--accent);font-weight:800;padding:.2rem .4rem;filter:brightness(1.4)}
.banner{background:rgba(225,29,72,.1);color:var(--danger);border-radius:12px;padding:.6rem .8rem;font-size:.82rem;margin-bottom:.5rem}

/* ===== Широкий экран: календарь слева ===== */
@media (min-width:900px){
  .wrap{max-width:1120px;display:grid;grid-template-columns:330px 1fr;gap:1.1rem;align-items:start;padding-bottom:9rem}
  .side{position:sticky;top:3.6rem}
  .chips{flex-wrap:wrap;overflow:visible}
  .dock{left:calc(50% - 560px + 330px + 1.1rem);right:calc(50% - 560px);padding-left:.75rem;padding-right:.75rem}
  .dock>*{max-width:none}
  .day{height:2.9rem}
  .ract{opacity:.55}.row:hover .ract{opacity:1}
}
@media (min-width:900px) and (max-width:1120px){.dock{left:calc(330px + 1.85rem);right:.75rem}}
</style>
</head>
<body class="theme-light density-compact">

<header class="top">
  <div class="grow">
    <h1>Ежедневник</h1>
    <div class="sub" id="todayLbl"></div>
  </div>
  <button class="ibtn" id="btnSearch" title="Поиск"></button>
  <button class="ibtn" id="btnCats" title="Разделы"></button>
  <button class="ibtn" id="btnSettings" title="Настройки"></button>
</header>

<div class="wrap">
  <aside class="side">
    <div id="banner"></div>
    <div class="search" id="searchBox" hidden>
      <span id="searchIc"></span>
      <input id="searchInp" type="search" placeholder="Поиск по всем делам" autocomplete="off">
    </div>
    <section class="card cal" id="cal">
      <div class="calhead">
        <button class="ibtn" id="calPrev" title="Назад"></button>
        <button class="caltitle" id="calTitle"></button>
        <button class="pill acc" id="calToday">Сегодня</button>
        <button class="ibtn" id="calNext" title="Вперёд"></button>
      </div>
      <div class="grid7" id="calGrid"></div>
    </section>
    <div class="chips" id="chips"></div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </main>
</div>

<div class="dock">
  <div class="transfer" id="transfer" hidden></div>
  <div class="addbar">
    <div class="addopts">
      <button class="pill" id="addDateBtn"></button>
      <button class="pill" id="addCatBtn"></button>
      <span style="font-size:.7rem;color:var(--muted);white-space:nowrap;padding-left:.2rem">каждая строка — отдельное дело</span>
    </div>
    <div class="addrow">
      <textarea id="addText" rows="1" placeholder="Новое дело…" enterkeyhint="enter"></textarea>
      <button class="send" id="addSend" title="Добавить"></button>
    </div>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<script>
'use strict';
/* =====================================================================
   ХРАНЕНИЕ. Ключ и формат — те же, что в прежней версии приложения,
   поэтому все ранее записанные дела и разделы подхватываются как есть.
   ===================================================================== */
const KEY = 'taskflow_advanced_data';
const BACKUP_KEY = 'taskflow_backup_before_planner_v2';   // копия старых данных, делается один раз
const IMPORT_BACKUP_KEY = 'taskflow_backup_before_import';

const PALETTE = ['#6366f1','#f59e0b','#10b981','#ef4444','#0ea5e9','#ec4899','#8b5cf6','#14b8a6','#84cc16','#f97316','#64748b'];
const ICON_EMOJI = {'fa-cart-shopping':'🛒','fa-briefcase':'💼','fa-house':'🏠','fa-heart':'❤️','fa-heart text-rose-500':'❤️','fa-dumbbell':'🏋️','fa-book':'📚','fa-folder':'📁'};
const DEF_SETTINGS = {theme:'light',fontSize:'16',brightness:'100',contrast:'100',
  density:'compact', wrapText:false, instantDone:false, view:null, calMode:'week', collapsed:{}, lastCat:null};

let state = {
  tasks: [],
  categories: [
    {id:'all', name:'Все разделы', icon:'fa-layer-group', isSystem:true},
    {id:'shopping', name:'Покупки', icon:'fa-cart-shopping'},
    {id:'work', name:'Работа', icon:'fa-briefcase'},
    {id:'home', name:'Дом и Быт', icon:'fa-house'}
  ],
  selectedCategory: 'all',
  activeTab: 'active',
  settings: {...DEF_SETTINGS}
};
let loadProblem = false;

function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (raw){
    try { if (!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw); } catch(e){}
    try {
      const p = JSON.parse(raw);
      state = {...state, ...p, settings:{...DEF_SETTINGS, ...(p.settings||{})}};
    } catch(e){ loadProblem = true; }
  }
  normalize();
  if (!state.settings.view){
    // При первом запуске: если датированных дел ещё нет — открываем «Все дела»
    state.settings.view = state.tasks.some(t=>t.date) ? 'day' : 'all';
  }
}
function normalize(){
  if (!Array.isArray(state.tasks)) state.tasks = [];
  if (!Array.isArray(state.categories)) state.categories = [];
  if (!state.categories.some(c=>c.id==='all')) state.categories.unshift({id:'all',name:'Все разделы',icon:'fa-layer-group',isSystem:true});
  let i = 0;
  state.categories.forEach(c=>{
    c.id = String(c.id);
    if (c.isSystem) return;
    if (!c.color) c.color = PALETTE[i % PALETTE.length];
    if (c.emoji === undefined) c.emoji = ICON_EMOJI[c.icon] || '';
    i++;
  });
  state.tasks = state.tasks.filter(t=>t && typeof t==='object');
  state.tasks.forEach(t=>{
    t.id = String(t.id ?? uid());
    t.text = String(t.text ?? '');
    t.checked = !!t.checked; t.isCompleted = !!t.isCompleted;
    if (t.date === undefined) t.date = '';
    if (t.time === undefined) t.time = '';
    if (t.note === undefined) t.note = '';
    if (t.prio === undefined) t.prio = 0;
    if (t.repeat === undefined) t.repeat = '';
  });
  if (!state.categories.some(c=>c.id===state.selectedCategory)) state.selectedCategory = 'all';
  if (!state.settings.collapsed || typeof state.settings.collapsed!=='object') state.settings.collapsed = {};
}
function save(){
  state.plannerVersion = 2;

}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }

/* ===================== Даты ===================== */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const todayStr = () => ymd(new Date());
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
function addMonths(s,n){ const d=parseYmd(s), day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return ymd(d); }
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_SH = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WD_SH = ['пн','вт','ср','чт','пт','сб','вс'];
function fmtShort(s){
  const t = todayStr();
  if (s===t) return 'сегодня';
  if (s===addDays(t,1)) return 'завтра';
  if (s===addDays(t,-1)) return 'вчера';
  const d = parseYmd(s), y = d.getFullYear()!==new Date().getFullYear() ? ' '+String(d.getFullYear()).slice(2) : '';
  return d.getDate()+' '+MON_SH[d.getMonth()]+y;
}
function fmtLong(s){ const d=parseYmd(s); return WD_FULL[d.getDay()]+', '+d.getDate()+' '+MON_GEN[d.getMonth()]; }
function relLabel(s){ const t=todayStr(); if(s===t) return 'Сегодня'; if(s===addDays(t,1)) return 'Завтра'; if(s===addDays(t,-1)) return 'Вчера'; return ''; }

const userCats = () => state.categories.filter(c=>!c.isSystem);
const catById = id => state.categories.find(c=>c.id===id && !c.isSystem);
const catOk = t => state.selectedCategory==='all' || t.categoryId===state.selectedCategory;

function catLabel(c){ return (c.emoji ? c.emoji+' ' : '') + c.name; }

function sortTasks(arr){
  const order = new Map(state.tasks.map((t,i)=>[t.id,i]));
  return arr.slice().sort((a,b)=>
    (a.checked-b.checked) ||
    ((a.date?0:1)-(b.date?0:1)) || (a.date||'').localeCompare(b.date||'') ||
    ((a.time?0:1)-(b.time?0:1)) || (a.time||'').localeCompare(b.time||'') ||
    ((b.prio||0)-(a.prio||0)) || (order.get(a.id)-order.get(b.id)));
}

const ui = { date: todayStr(), search:'', addDate: undefined, addCat: null };

/* ===================== Действия с делами ===================== */
let undoSnap = null;
function snapshot(){ undoSnap = JSON.stringify(state.tasks); }
function undo(){ if(!undoSnap) return; state.tasks = JSON.parse(undoSnap); undoSnap=null; save(); render(); }

function nextRepeatDate(t){
  const base = t.date || todayStr();
  switch(t.repeat){
    case 'daily': return addDays(base,1);
    case 'weekdays': { let d = addDays(base,1); while([0,6].includes(parseYmd(d).getDay())) d = addDays(d,1); return d; }
    case 'weekly': return addDays(base,7);
    case 'monthly': return addMonths(base,1);
    case 'yearly': return addMonths(base,12);
  }
  return '';
}
function completeTasks(list){
  const spawned = [];
  list.forEach(t=>{
    t.isCompleted = true; t.checked = true; t.completedAt = new Date().toISOString();
    if (t.repeat){
      const n = {...t, id:uid(), checked:false, isCompleted:false, completedAt:undefined, date:nextRepeatDate(t), createdAt:new Date().toISOString()};
      delete n.completedAt; spawned.push(n);
      t.repeat = '';            // повтор «переезжает» на новое дело
    }
  });
  state.tasks.unshift(...spawned);
  return spawned.length;
}
function toggleCheck(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if (t.isCompleted){ restore(id); return; }
  if (state.settings.instantDone){
    snapshot(); const n = completeTasks([t]); save(); render();
    toast(n ? 'Выполнено · следующее повторение создано' : 'Перенесено в исполненные', true);
  } else { t.checked = !t.checked; save(); render(); }
}
function transferChecked(){
  const list = state.tasks.filter(t=>!t.isCompleted && t.checked);
  if(!list.length) return;
  snapshot(); completeTasks(list); save(); render();
  toast(`В исполненные: ${list.length}`, true);
}
function uncheckAll(){ state.tasks.forEach(t=>{ if(!t.isCompleted) t.checked=false; }); save(); render(); }
function restore(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.isCompleted=false; t.checked=false; delete t.completedAt; save(); render();
}
function delTask(id){
  const x = state.tasks.find(t=>t.id===id); if(!x) return;
  if (x.isCompleted && !confirm(`Удалить навсегда исполненное дело «${x.text}»?`)) return;
  snapshot(); state.tasks = state.tasks.filter(t=>t.id!==id); save(); render(); toast('Дело удалено', true);
}
function moveOverdueToday(){
  const t = todayStr(); let n=0;
  state.tasks.forEach(x=>{ if(!x.isCompleted && x.date && x.date<t && catOk(x)){ x.date=t; n++; } });
  if(n){ save(); render(); toast(`Перенесено на сегодня: ${n}`); }
}

/* ===================== Быстрый ввод ===================== */
function effAddDate(){ if (ui.addDate!==undefined) return ui.addDate; return state.settings.view==='day' ? ui.date : ''; }
function effAddCat(){
  if (ui.addCat && catById(ui.addCat)) return ui.addCat;
  if (state.selectedCategory!=='all' && catById(state.selectedCategory)) return state.selectedCategory;
  if (state.settings.lastCat && catById(state.settings.lastCat)) return state.settings.lastCat;
  return userCats()[0]?.id || '';
}
function parseLine(line, baseDate){
  let text = ' '+line+' ', date = baseDate, time = '';
  const t = todayStr();
  text = text.replace(/\s(сегодня|завтра|послезавтра)(?=\s)/i, (m,w)=>{ w=w.toLowerCase(); date = w==='сегодня'?t : w==='завтра'?addDays(t,1) : addDays(t,2); return ' '; });
  text = text.replace(/\s(?:в\s)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/, (m,h,mi)=>{ time = pad(h)+':'+mi; return ' '; });
  text = text.replace(/\s+/g,' ').trim();
  return {text: text || line.trim(), date, time};
}
function addFromInput(){
  const ta = $('#addText');
  const lines = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return;
  if(!userCats().length){ state.categories.push({id:uid(),name:'Общее',icon:'fa-folder',emoji:'📁',color:PALETTE[0]}); }
  const cat = effAddCat(), d = effAddDate(), now = new Date().toISOString();
  const items = lines.map(l=>{ const p = parseLine(l,d);
    return {id:uid(), text:p.text, categoryId:cat, checked:false, isCompleted:false, createdAt:now, date:p.date, time:p.time, note:'', prio:0, repeat:''}; });
  state.tasks.unshift(...items);
  state.settings.lastCat = cat;
  ta.value=''; autoGrow(); save(); render();
  if (lines.length>1) toast(`Добавлено дел: ${lines.length}`);
}
function autoGrow(){ const ta=$('#addText'); ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight, 152)+'px'; $('#addSend').disabled=!ta.value.trim(); }

function renderTop(){

}

function calMode(){ return window.matchMedia('(min-width:900px)').matches ? 'month' : state.settings.calMode; }
function renderCal(){
  const mode = calMode(), sel = ui.date, t = todayStr();
  const cal = $('#cal'); cal.classList.toggle('month', mode==='month');
  const d0 = parseYmd(sel);
  $('#calTitle').innerHTML = esc(MONTHS[d0.getMonth()]+' '+d0.getFullYear()) + ic('down');
  // сводка по датам
  const map = {};
  state.tasks.forEach(x=>{ if(x.isCompleted||!x.date||!catOk(x)) return;
    const m = map[x.date] || (map[x.date]={n:0,c:[]}); m.n++;
    const c = catById(x.categoryId); const col = c ? c.color : '#94a3b8';
    if(!m.c.includes(col)) m.c.push(col); });
  let start, days;
  if (mode==='week'){ const wd=(d0.getDay()+6)%7; start=addDays(sel,-wd); days=7; }
  else { const first = new Date(d0.getFullYear(), d0.getMonth(), 1); const wd=(first.getDay()+6)%7;
    start = addDays(ymd(first), -wd); const last = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate();
    days = Math.ceil((wd+last)/7)*7; }
  let h = WD_SH.map((w,i)=>`<div class="wd ${i>4?'we':''}">${w}</div>`).join('');
  for(let i=0;i<days;i++){
    const ds = addDays(start,i), dd = parseYmd(ds), m = map[ds];
    const cls = ['day'];
    if (ds===sel) cls.push('sel'); if (ds===t) cls.push('today');
    if (mode==='month' && dd.getMonth()!==d0.getMonth()) cls.push('oth');
    if (dd.getDay()===0||dd.getDay()===6) cls.push('we');
    if (m && ds<t) cls.push('late');
    const dots = m ? m.c.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('') : '';
    h += `<button class="${cls.join(' ')}" data-date="${ds}" title="${m?m.n+' дел':''}"><span class="n">${dd.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  $('#calGrid').innerHTML = h;
}
function calShift(dir){
  ui.date = calMode()==='week' ? addDays(ui.date, 7*dir) : addMonths(ui.date, dir);
  ui.addDate = undefined; render();
}

function renderChips(){

function rowHtml(t, o={}){

  if (o.showDate && t.date) meta += `<span class="db ${od?'od':''}">${fmtShort(t.date)}</span>`;
  if (o.showCat && c) meta += `<span class="cdot" style="background:${c.color}" title="${esc(c.name)}"></span>`;
  if (t.isCompleted){
    return `<div class="row done" data-id="${esc(t.id)}">
      <button class="chk done" data-act="restore" title="Вернуть в активные">${ic('check')}</button>

      <button class="ract" data-act="restore" title="Вернуть">${ic('undo')}</button>

function groupHtml(key, title, tasks, o={}){
  if (!tasks.length && !o.keepEmpty) return '';
  const col = state.settings.collapsed;
  const closed = key in col ? col[key] : !!o.defClosed;
  const dot = o.color ? `<span class="c" style="background:${o.color}"></span>` : '';
  const head = o.noHead ? '' : `<div class="gh ${closed?'closed':''} ${o.red?'red':''}" data-act="group" data-g="${esc(key)}">
      <span class="chev">${ic('down')}</span><span class="gt">${dot}${esc(title)}</span>
      ${o.action||''}<span class="cnt">${tasks.length}</span></div>`;
  const body = (closed && !o.noHead) ? '' : `<div class="rows">${tasks.map(t=>rowHtml(t,o)).join('') || `<div class="empty" style="padding:.8rem">${esc(o.emptyText||'Пусто')}</div>`}</div>`;
  return `<section class="card group">${head}${body}</section>`;
}
function emptyHtml(icon, text){ return `<div class="card"><div class="empty">${ic(icon)}${text}</div></div>`; }

function renderList(){
  const L = $('#list'), v = state.settings.view, t = todayStr(), allCats = state.selectedCategory==='all';

    const q = ui.search.trim().toLowerCase();

    h += `<div class="dayhead"><h2>Поиск</h2><span>найдено: ${found.length}</span></div>`;
    h += groupHtml('s-a','Активные', sortTasks(found.filter(x=>!x.isCompleted)), {showDate:true,showCat:true});
    h += groupHtml('s-d','Исполненные', found.filter(x=>x.isCompleted), {showDate:true,showCat:true});
    if(!found.length) h += emptyHtml('search','Ничего не найдено');

                     : emptyHtml('cal', 'На этот день дел нет.<br>Впишите их внизу — они встанут на выбранную дату.');

    h += groupHtml('d-done','Выполнено в этот день', doneDay, {showCat:allCats, defClosed:true});

      const tm = addDays(t,1), wk = addDays(t,7);
      h += groupHtml('b-od','Просрочено', sortTasks(A.filter(x=>x.date && x.date<t)), {showDate:true, red:true,
        action:`<button class="gact" data-act="od-today">→ на сегодня</button>`});
      h += groupHtml('b-t','Сегодня', sortTasks(A.filter(x=>x.date===t)), {});
      h += groupHtml('b-tm','Завтра', sortTasks(A.filter(x=>x.date===tm)), {});
      h += groupHtml('b-w','Ближайшая неделя', sortTasks(A.filter(x=>x.date>tm && x.date<=wk)), {showDate:true});
      h += groupHtml('b-l','Позже', sortTasks(A.filter(x=>x.date>wk)), {showDate:true});
      h += groupHtml('b-nd','Без даты', sortTasks(A.filter(x=>!x.date)), {});
    }
  }
  else if (v==='nodate'){
    const nd = A.filter(x=>!x.date);
    if (!nd.length) h += emptyHtml('inbox','Все дела распределены по датам');
    else if (allCats){
      userCats().forEach(c=>{ h += groupHtml('n-'+c.id, catLabel(c), sortTasks(nd.filter(x=>x.categoryId===c.id)), {color:c.color}); });
      h += groupHtml('n-orphan','Без раздела', sortTasks(nd.filter(x=>!catById(x.categoryId))), {});
    } else h += groupHtml('n-one','', sortTasks(nd), {noHead:true});
  }
  else if (v==='done'){
    const D = state.tasks.filter(x=>x.isCompleted && catOk(x));
    if (!D.length) h += emptyHtml('archive','Исполненных дел пока нет.<br>Отмечайте дела галочкой и переносите сюда.');
    else {
      h += `<div class="dayhead"><h2>Исполненные</h2><button class="pill" data-act="clear-done">${ic('trash')} Очистить</button></div>`;
      const by = {}; const order = [];
      D.slice().sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).forEach(x=>{
        const k = x.completedAt ? ymd(new Date(x.completedAt)) : 'old';
        if(!by[k]){ by[k]=[]; order.push(k); } by[k].push(x); });
      order.forEach((k,i)=>{
        const title = k==='old' ? 'Ранее' : (relLabel(k) ? relLabel(k)+', '+fmtLong(k).split(', ')[1] : fmtLong(k));
        h += groupHtml('x-'+k, title, by[k], {showCat:allCats, showDate:true, defClosed: i>2});
      });
    }
  }
  L.innerHTML = h;
}

async function exportData(){
  const name = `ezhednevnik-backup-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify(state,null,1)], {type:'application/json'});
  try {
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title:'Резервная копия ежедневника'}); return;
    }
  } catch(e){ if (e && e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Файл копии сохранён');
}
function importFile(file){
  const r = new FileReader();
  r.onload = ()=>{
    let p; try { p = JSON.parse(r.result); } catch(e){ toast('Это не файл копии ежедневника'); return; }
    if (!p || !Array.isArray(p.tasks)){ toast('В файле нет списка дел'); return; }
    openSheet(`<h3>${ic('ul')} Загрузка копии</h3>
      <p class="note">В файле: дел — ${p.tasks.length}, разделов — ${(p.categories||[]).filter(c=>!c.isSystem).length}.<br>Сейчас на устройстве: дел — ${state.tasks.length}.</p>
      <div class="list-opt" style="margin-top:.6rem">
        <button class="opt" id="iMerge">${ic('plus')} Объединить — добавить недостающие дела и разделы</button>
        <button class="opt" id="iRepl" style="color:var(--danger)">${ic('undo')} Заменить всё содержимым файла</button>
      </div>
      <p class="note" style="margin-top:.6rem">Перед загрузкой текущие данные автоматически сохраняются отдельно.</p>`, b=>{
      const pre = ()=>{ try{ localStorage.setItem(IMPORT_BACKUP_KEY, JSON.stringify(state)); }catch(e){} };
      b.querySelector('#iMerge').onclick = ()=>{ pre();
        const ids = new Set(state.tasks.map(t=>String(t.id))); const cids = new Set(state.categories.map(c=>String(c.id)));
        (p.categories||[]).forEach(c=>{ if(!cids.has(String(c.id))) state.categories.push(c); });
        const add = p.tasks.filter(t=>!ids.has(String(t.id))); state.tasks.push(...add);
        normalize(); save(); closeSheet(); render(); toast(`Добавлено дел: ${add.length}`); };
      b.querySelector('#iRepl').onclick = ()=>{ if(!confirm('Точно заменить все текущие дела содержимым файла?')) return; pre();
        state = {...state, ...p, settings:{...DEF_SETTINGS, ...(p.settings||{})}}; normalize(); save(); applySettings(); closeSheet(); render(); toast('Данные загружены'); };
    });
  };
  r.readAsText(file);
}

let toastTimer = null;
function toast(msg, withUndo){
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className='toast';
  el.innerHTML = `<span>${esc(msg)}</span>` + (withUndo && undoSnap ? '<button>Отменить</button>' : '');
  const b = el.querySelector('button'); if (b) b.onclick = ()=>{ undo(); el.remove(); };
  document.body.appendChild(el); toastTimer = setTimeout(()=>el.remove(), withUndo?5000:2500);
}

    if(box.hidden){ ui.search=''; $('#searchInp').value=''; } else { window.scrollTo({top:0}); $('#searchInp').focus(); } render(); };
  $('#searchInp').oninput = e=>{ ui.search=e.target.value; renderList(); };
  $('#btnCats').onclick = openCats;
  $('#btnSettings').onclick = openSettings;

  $('#calPrev').onclick = ()=>calShift(-1);
  $('#calNext').onclick = ()=>calShift(1);
  $('#calToday').onclick = ()=>{ ui.date=todayStr(); ui.addDate=undefined; state.settings.view='day'; save(); render(); };
  $('#calTitle').onclick = ()=>{ if (window.matchMedia('(min-width:900px)').matches) return;
    state.settings.calMode = state.settings.calMode==='week'?'month':'week'; save(); renderCal(); };
  $('#calGrid').onclick = e=>{ const d=e.target.closest('[data-date]'); if(!d) return;
    ui.date=d.dataset.date; ui.addDate=undefined; state.settings.view='day'; save(); render(); };
  // свайп по календарю
  let sx=null, sy=null;
  $('#cal').addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  $('#cal').addEventListener('touchend', e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) calShift(dx<0?1:-1); sx=null; }, {passive:true});

  $('#chips').onclick = e=>{ const c=e.target.closest('[data-cat]'); if(!c) return;
    if (c.dataset.cat==='__manage'){ openCats(); return; }
    state.selectedCategory = c.dataset.cat; ui.addCat=null; save(); render(); };
  $('#tabs').onclick = e=>{ const v=e.target.closest('[data-view]'); if(!v) return;
    state.settings.view=v.dataset.view; ui.addDate=undefined; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); };

  $('#list').onclick = e=>{
    const a = e.target.closest('[data-act]'); if(!a) return;
    const id = a.closest('[data-id]')?.dataset.id;
    switch(a.dataset.act){
      case 'check': toggleCheck(id); break;
      case 'edit': openEdit(id); break;
      case 'restore': restore(id); break;
      case 'del': delTask(id); break;
      case 'od-today': e.stopPropagation(); moveOverdueToday(); break;
      case 'clear-done': {
        const D = state.tasks.filter(x=>x.isCompleted && catOk(x));
        if (D.length && confirm(`Удалить навсегда исполненные дела (${D.length})?`)){ snapshot(); const s=new Set(D.map(x=>x.id)); state.tasks=state.tasks.filter(x=>!s.has(x.id)); save(); render(); toast('Исполненные очищены', true); }
        break; }
      case 'group': { const k=a.dataset.g; const col=state.settings.collapsed;
        const cur = k in col ? col[k] : a.classList.contains('closed'); col[k] = !cur; save(); renderList(); break; }
    }
  };
  $('#transfer').onclick = e=>{ const a=e.target.closest('[data-act]'); if(!a) return;
    if(a.dataset.act==='transfer') transferChecked(); else uncheckAll(); };

  const ta = $('#addText');
  ta.addEventListener('input', autoGrow);
  ta.addEventListener('keydown', e=>{
    // На компьютере: Enter — добавить, Shift+Enter — новая строка. На телефоне Enter — новая строка.
    const touch = matchMedia('(pointer:coarse)').matches;
    if (e.key==='Enter' && !e.shiftKey && (!touch || e.metaKey || e.ctrlKey)){ e.preventDefault(); addFromInput(); }
  });
  $('#addSend').onclick = addFromInput;
  $('#addDateBtn').onclick = openAddDate;
  $('#addCatBtn').onclick = openAddCat;

  $('#sheetBg').onclick = closeSheet;
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#sheetWrap').hidden) closeSheet(); });
  matchMedia('(min-width:900px)').addEventListener?.('change', renderCal);
  // смена дня, пока приложение открыто
  let lastDay = todayStr();
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && todayStr()!==lastDay){ if(ui.date===lastDay) ui.date=todayStr(); lastDay=todayStr(); render(); } });
}

load(); applySettings(); bind(); autoGrow(); render();
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
