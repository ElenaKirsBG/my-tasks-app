<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач с быстрым многострочным вводом</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Кастомные плавные переходы */
        * {
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
        }
        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body id="app-body" class="bg-slate-100 text-slate-800 min-h-screen font-sans flex flex-col antialiased">

    <!-- Верхняя панель навигации -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900" id="header-title">TaskFlow Pro</h1>
                    <p class="text-xs text-slate-500">Умное планирование и быстрый ввод</p>
                </div>
            </div>

            <!-- Управление темами и настройками -->
            <div class="flex items-center gap-2">
                <button onclick="toggleSettingsModal()" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl transition" title="Настройки оформления">
                    <i class="fa-solid fa-sliders text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full flex flex-col md:flex-row gap-6">

        <!-- Боковая панель категорий -->
        <aside class="w-full md:w-64 flex-shrink-0 flex flex-col gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Категории</span>
                    <button onclick="openCategoryModal()" class="text-indigo-600 hover:text-indigo-700 text-xs font-medium flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Новая
                    </button>
                </div>
                <!-- Список категорий -->
                <div id="categories-list" class="flex flex-col gap-1 max-h-60 md:max-h-none overflow-y-auto">
                    <!-- Категории будут добавлены динамически через JS -->
                </div>
            </div>
        </aside>

        <!-- Рабочая область -->
        <section class="flex-1 flex flex-col gap-6">

            <!-- Блок многострочного быстрого ввода -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-3">
                <label for="task-textarea" class="text-sm font-semibold text-slate-700 flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-amber-500"></i> Быстрый ввод задач
                    </span>
                    <span class="text-xs font-normal text-slate-400">Каждая новая строка — отдельная задача</span>
                </label>
                <textarea id="task-textarea" rows="3" class="w-full p-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y text-sm bg-slate-50/50" placeholder="Купить молоко&#10;Записаться к врачу&#10;Подготовить отчет по проекту"></textarea>
                
                <div class="flex justify-end">
                    <button onclick="addTasksFromTextarea()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium px-5 py-2.5 rounded-xl shadow-md shadow-indigo-100 flex items-center gap-2 text-sm transition-all">
                        <i class="fa-solid fa-arrow-down-long"></i> Перенести в список
                    </button>
                </div>
            </div>

            <!-- Панель управления списками и вкладки -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3 flex-wrap gap-2">
                    <!-- Переключатель вкладок -->
                    <div class="flex bg-slate-200/70 p-1 rounded-xl text-xs font-medium">
                        <button id="tab-active-btn" onclick="switchTab('active')" class="px-4 py-2 rounded-lg bg-white text-slate-800 shadow-sm font-semibold flex items-center gap-2">
                            <i class="fa-solid fa-clock"></i>
                            Активные задачи
                            <span id="active-badge" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                        <button id="tab-completed-btn" onclick="switchTab('completed')" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-circle-check text-emerald-500"></i>
                            Исполненные
                            <span id="completed-badge" class="bg-slate-300/50 text-slate-600 px-2 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                    </div>

                    <!-- Кнопка переноса отмеченных задач в выполненные -->
                    <div id="transfer-btn-container" class="hidden">
                        <button onclick="transferCheckedToCompleted()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-medium px-4 py-2 rounded-xl shadow-sm flex items-center gap-2 transition-all">
                            <i class="fa-solid fa-box-archive"></i> Перенести отмеченные в список исполненных
                        </button>
                    </div>
                </div>

                <!-- Контейнер списков -->
                <div class="flex flex-col gap-3">
                    
                    <!-- Список 1: Активные дела -->
                    <div id="active-tasks-container" class="space-y-2">
                        <!-- Динамический список активных дел -->
                    </div>

                    <!-- Список 2: Исполненные / Сделанные дела -->
                    <div id="completed-tasks-container" class="space-y-2 hidden">
                        <!-- Динамический список исполненных дел -->
                    </div>

                    <!-- Пустое состояние -->
                    <div id="empty-state" class="hidden text-center py-12 px-4 bg-white/50 border border-dashed border-slate-300 rounded-2xl">
                        <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-inbox text-xl"></i>
                        </div>
                        <h3 class="text-sm font-semibold text-slate-600" id="empty-state-title">Задач пока нет</h3>
                        <p class="text-xs text-slate-400 mt-1" id="empty-state-desc">Введите задачи в текстовом поле выше и нажмите «Перенести в список»</p>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Модальное окно: Категории -->
    <div id="category-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl border border-slate-100 transform scale-95 transition-transform">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-folder-plus text-indigo-600"></i> Создать категорию
            </h3>
            <input type="text" id="new-category-name" placeholder="Название (напр. Работа, Дом)" class="w-full p-3 border border-slate-200 rounded-xl text-sm mb-4 outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeCategoryModal()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-xl text-xs font-medium">Отмена</button>
                <button onclick="saveNewCategory()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-medium shadow-sm">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Настройки темы и интерфейса -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-slate-100 transform scale-95 transition-transform">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-indigo-600"></i> Персонализация и настройки
                </h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4 text-sm">
                <!-- Тема оформления -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Режим темы</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setThemeMode('light')" id="theme-light-btn" class="p-2.5 border rounded-xl flex items-center justify-center gap-2 text-xs font-medium">
                            <i class="fa-solid fa-sun text-amber-500"></i> Светлая
                        </button>
                        <button onclick="setThemeMode('dark')" id="theme-dark-btn" class="p-2.5 border rounded-xl flex items-center justify-center gap-2 text-xs font-medium">
                            <i class="fa-solid fa-moon text-indigo-400"></i> Тёмная
                        </button>
                    </div>
                </div>

                <!-- Размер шрифта -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Размер шрифта</label>
                    <select id="font-size-select" onchange="updateSettings()" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs outline-none bg-slate-50">
                        <option value="14">Маленький (14px)</option>
                        <option value="16" selected>Стандартный (16px)</option>
                        <option value="18">Увеличенный (18px)</option>
                    </select>
                </div>

                <!-- Цветовая акцентная гамма -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Основной цвет текста/акцентов</label>
                    <div class="flex gap-3">
                        <button onclick="setAccentColor('indigo')" class="w-8 h-8 rounded-full bg-indigo-600 ring-2 ring-offset-2 ring-indigo-600"></button>
                        <button onclick="setAccentColor('emerald')" class="w-8 h-8 rounded-full bg-emerald-600"></button>
                        <button onclick="setAccentColor('rose')" class="w-8 h-8 rounded-full bg-rose-600"></button>
                        <button onclick="setAccentColor('slate')" class="w-8 h-8 rounded-full bg-slate-800"></button>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                <button onclick="toggleSettingsModal()" class="px-5 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium">Готово</button>
            </div>
        </div>
    </div>

    <!-- Скрипт логики приложения -->
    <script>
        // Состояние приложения
        let state = {
            tasks: [],
            categories: [
                { id: 'all', name: 'Все задачи', icon: 'fa-layer-group' },
                { id: 'personal', name: 'Личные', icon: 'fa-user' },
                { id: 'work', name: 'Работа', icon: 'fa-briefcase' }
            ],
            selectedCategory: 'all',
            activeTab: 'active', // 'active' или 'completed'
            settings: {
                theme: 'light',
                fontSize: '16',
                accentColor: 'indigo'
            }
        };

        // Загрузка данных при инициализации
        window.onload = function() {
            loadFromLocalStorage();
            applySettings();
            renderCategories();
            renderTasks();
        };

        // --- Сохранение и загрузка ---
        function saveToLocalStorage() {
            localStorage.setItem('taskflow_data', JSON.stringify(state));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('taskflow_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) {
                    console.error('Ошибка загрузки данных из localStorage', e);
                }
            }
        }

        // --- Многострочный быстрый ввод ---
        function addTasksFromTextarea() {
            const textarea = document.getElementById('task-textarea');
            const rawText = textarea.value;
            if (!rawText.trim()) return;

            // Разбиваем по переносу строки, убираем пустые пробельные строки
            const lines = rawText.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (lines.length === 0) return;

            // Создаем объекты задач
            const newTasks = lines.map(text => ({
                id: Date.now() + Math.random().toString(36).substr(2, 9),
                text: text,
                categoryId: state.selectedCategory === 'all' ? 'personal' : state.selectedCategory,
                checked: false,      // Отметка зачеркивания (Этап 1)
                isCompleted: false,  // Перенесено в выполненные (Этап 2)
                createdAt: new Date().toISOString()
            }));

            state.tasks.unshift(...newTasks);
            textarea.value = ''; // Очищаем поле ввода

            saveToLocalStorage();
            renderTasks();
        }

        // --- Двухэтапная обработка выполненных задач ---

        // Этап 1: Переключение отметки (зачеркивает задачу прямо в текущем списке)
        function toggleTaskCheck(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.checked = !task.checked;
                saveToLocalStorage();
                renderTasks();
            }
        }

        // Этап 2: Кнопка переноса отмеченных (зачеркнутых) в список "Исполненные"
        function transferCheckedToCompleted() {
            let hasChanges = false;
            state.tasks.forEach(task => {
                if (!task.isCompleted && task.checked) {
                    task.isCompleted = true;
                    hasChanges = true;
                }
            });

            if (hasChanges) {
                saveToLocalStorage();
                renderTasks();
            }
        }

        // Восстановление задачи обратно в активные
        function restoreTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                task.isCompleted = false;
                task.checked = false; // Снимаем зачеркивание при возврате
                saveToLocalStorage();
                renderTasks();
            }
        }

        // Удаление задачи
        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id === id);
            saveToLocalStorage();
            renderTasks();
        }

        // --- Переключение вкладок ---
        function switchTab(tab) {
            state.activeTab = tab;
            
            const activeBtn = document.getElementById('tab-active-btn');
            const completedBtn = document.getElementById('tab-completed-btn');

            if (tab === 'active') {
                activeBtn.className = "px-4 py-2 rounded-lg bg-white text-slate-800 shadow-sm font-semibold flex items-center gap-2";
                completedBtn.className = "px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 flex items-center gap-2";
                document.getElementById('active-tasks-container').classList.remove('hidden');
                document.getElementById('completed-tasks-container').classList.add('hidden');
            } else {
                completedBtn.className = "px-4 py-2 rounded-lg bg-white text-slate-800 shadow-sm font-semibold flex items-center gap-2";
                activeBtn.className = "px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 flex items-center gap-2";
                document.getElementById('completed-tasks-container').classList.remove('hidden');
                document.getElementById('active-tasks-container').classList.add('hidden');
            }

            renderTasks();
        }

        // --- Рендеринг интерфейса ---
        function renderTasks() {
            const activeContainer = document.getElementById('active-tasks-container');
            const completedContainer = document.getElementById('completed-tasks-container');
            const emptyState = document.getElementById('empty-state');
            const transferBtnContainer = document.getElementById('transfer-btn-container');

            // Фильтрация по категории
            const categoryFiltered = state.tasks.filter(t => 
                state.selectedCategory === 'all' || t.categoryId === state.selectedCategory
            );

            // Разделение на активные и исполненные
            const activeTasks = categoryFiltered.filter(t => !t.isCompleted);
            const completedTasks = categoryFiltered.filter(t => t.isCompleted);

            // Обновление бейджей с количеством
            document.getElementById('active-badge').innerText = activeTasks.length;
            document.getElementById('completed-badge').innerText = completedTasks.length;

            // Проверка: есть ли задачи с отметкой, готовые к переносу
            const hasCheckedTasks = activeTasks.some(t => t.checked);
            if (hasCheckedTasks && state.activeTab === 'active') {
                transferBtnContainer.classList.remove('hidden');
            } else {
                transferBtnContainer.classList.add('hidden');
            }

            // Рендер активных задач
            activeContainer.innerHTML = '';
            activeTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `p-3.5 bg-white border rounded-xl flex items-center justify-between gap-3 shadow-sm hover:border-slate-300 ${task.checked ? 'bg-slate-50 border-slate-200' : 'border-slate-200/80'}`;
                
                item.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <button onclick="toggleTaskCheck('${task.id}')" class="w-6 h-6 rounded-lg border ${task.checked ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 hover:border-indigo-500'} flex items-center justify-center flex-shrink-0 transition-colors">
                            ${task.checked ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <span class="text-sm ${task.checked ? 'line-through text-slate-400' : 'text-slate-700'} truncate select-none">
                            ${escapeHtml(task.text)}
                        </span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg transition" title="Удалить">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                activeContainer.appendChild(item);
            });

            // Рендер исполненных задач
            completedContainer.innerHTML = '';
            completedTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = "p-3.5 bg-slate-50 border border-slate-200/60 rounded-xl flex items-center justify-between gap-3 opacity-80";
                
                item.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <div class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-check text-xs"></i>
                        </div>
                        <span class="text-sm line-through text-slate-400 truncate">
                            ${escapeHtml(task.text)}
                        </span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="restoreTask('${task.id}')" class="text-slate-400 hover:text-indigo-600 p-1.5 rounded-lg transition text-xs flex items-center gap-1" title="Вернуть в активные">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg transition" title="Удалить полностью">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                completedContainer.appendChild(item);
            });

            // Отображение пустого состояния
            const currentList = state.activeTab === 'active' ? activeTasks : completedTasks;
            if (currentList.length === 0) {
                emptyState.classList.remove('hidden');
                if (state.activeTab === 'completed') {
                    document.getElementById('empty-state-title').innerText = "Нет исполненных дел";
                    document.getElementById('empty-state-desc').innerText = "Отметьте задачи и нажмите «Перенести в список исполненных»";
                } else {
                    document.getElementById('empty-state-title').innerText = "Список активных дел пуст";
                    document.getElementById('empty-state-desc').innerText = "Введите задачи в текстовом поле выше и нажмите «Перенести в список»";
                }
            } else {
                emptyState.classList.add('hidden');
            }
        }

        // Рендер категорий
        function renderCategories() {
            const list = document.getElementById('categories-list');
            list.innerHTML = '';

            state.categories.forEach(cat => {
                const isSelected = state.selectedCategory === cat.id;
                const btn = document.createElement('button');
                btn.onclick = () => selectCategory(cat.id);
                btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-medium flex items-center justify-between ${
                    isSelected ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'
                }`;

                const count = state.tasks.filter(t => !t.isCompleted && (cat.id === 'all' || t.categoryId === cat.id)).length;

                btn.innerHTML = `
                    <span class="flex items-center gap-2 truncate">
                        <i class="fa-solid ${cat.icon || 'fa-folder'} text-xs ${isSelected ? 'text-indigo-600' : 'text-slate-400'}"></i>
                        ${escapeHtml(cat.name)}
                    </span>
                    <span class="bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-md text-[10px]">${count}</span>
                `;
                list.appendChild(btn);
            });
        }

        function selectCategory(id) {
            state.selectedCategory = id;
            renderCategories();
            renderTasks();
        }

        // Модальное окно категорий
        function openCategoryModal() {
            const modal = document.getElementById('category-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeCategoryModal() {
            const modal = document.getElementById('category-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function saveNewCategory() {
            const input = document.getElementById('new-category-name');
            const name = input.value.trim();
            if (!name) return;

            const newCat = {
                id: Date.now().toString(36),
                name: name,
                icon: 'fa-folder'
            };

            state.categories.push(newCat);
            input.value = '';
            closeCategoryModal();
            saveToLocalStorage();
            renderCategories();
        }

        // --- Настройки интерфейса ---
        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.querySelector('div').classList.remove('scale-95');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                modal.querySelector('div').classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 200);
            }
        }

        function setThemeMode(mode) {
            state.settings.theme = mode;
            applySettings();
            saveToLocalStorage();
        }

        function setAccentColor(color) {
            state.settings.accentColor = color;
            applySettings();
            saveToLocalStorage();
        }

        function updateSettings() {
            const fontSelect = document.getElementById('font-size-select');
            state.settings.fontSize = fontSelect.value;
            applySettings();
            saveToLocalStorage();
        }

        function applySettings() {
            const body = document.getElementById('app-body');
            const fontSelect = document.getElementById('font-size-select');
            
            if (fontSelect) fontSelect.value = state.settings.fontSize;

            // Шрифт
            body.style.fontSize = `${state.settings.fontSize}px`;

            // Темная / Светлая тема
            if (state.settings.theme === 'dark') {
                body.classList.remove('bg-slate-100', 'text-slate-800');
                body.classList.add('bg-slate-900', 'text-slate-100');
            } else {
                body.classList.remove('bg-slate-900', 'text-slate-100');
                body.classList.add('bg-slate-100', 'text-slate-800');
            }
        }

        // Экранирование строк для безопасности
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
